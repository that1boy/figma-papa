name: glm-design-pilot
services:
  app:
    build:
      context: .
      target: app
    image: glm-design-pilot-app:0.1.2
    env_file: .env
    environment:
      DATA_DIR: /app/data
      HOST: 0.0.0.0
      RENDER_URL: http://renderer:8081
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - studio-data:/app/data
    networks: [app-network, render-network]
    depends_on:
      renderer:
        condition: service_healthy
    init: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 3
  renderer:
    build:
      context: .
      target: renderer
    image: glm-design-pilot-renderer:0.1.2
    environment:
      RENDER_TOKEN: ${RENDER_TOKEN:?Set RENDER_TOKEN in .env}
      RENDER_PORT: 8081
      HOME: /tmp
    networks: [render-network]
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=512m,mode=1777
    shm_size: 256m
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8081/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 3
volumes:
  studio-data:
networks:
  app-network:
  render-network:
    internal: true
